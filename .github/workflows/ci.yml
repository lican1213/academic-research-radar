name: Academic Radar CI

on:
  push:
    paths:
      - 'radar.py'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q radar.py chinese_journals.py tests
      - run: python -m unittest discover -s tests -v
