name: One-shot Policy Shock PDF Handoff (temporary PR)
on:
  pull_request:
    paths:
      - 'oneoff_policy_pdf_20261124.py'
      - '.github/workflows/oneoff-policy-pdf-20261124.yml'
permissions:
  contents: read
jobs:
  original-pdf-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated retrieval code
        run: python -m compileall -q oneoff_policy_pdf_20261124.py pdf_probe.py
      - name: Install PDF parser for actual text/identity validation
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Fetch exact five public original PDFs without bypass
        id: probe
        continue-on-error: true
        run: python oneoff_policy_pdf_20261124.py
      - name: Store only evidence metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-shock-pdf-evidence-oneoff
          path: oneoff_policy_pdf_evidence.json
          retention-days: 7
          if-no-files-found: warn
      - name: One-day original PDF ZIP handoff
        if: steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: policy-shock-verified-pdfs-oneoff
          path: policy_shock_verified_originals_oneoff.zip
          retention-days: 1
          if-no-files-found: error
      - name: Enforce actual PDF readback
        if: steps.probe.outcome != 'success'
        run: exit 1
