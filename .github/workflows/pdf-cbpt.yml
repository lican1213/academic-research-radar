name: WES 2026-11 two-paper original-PDF acceptance (on demand)

on:
  pull_request:
    paths:
      - 'pdf_cbpt.py'
      - 'tests/test_pdf_cbpt.py'
      - '.github/workflows/pdf-cbpt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial offline tests
        run: python -m unittest discover -s tests -p 'test_pdf_cbpt.py' -v
      - name: Install isolated PDF and browser readers
        run: |
          python -m pip install 'PyMuPDF>=1.24,<2' 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Two named publisher PDFs - anonymous readback
        id: attempt
        continue-on-error: true
        run: python pdf_cbpt.py --out wes-pdf-evidence.json --zip-out WES_2026_11_Two_Papers.zip
      - name: Preserve evidence only (no paper bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WES_2026_11_pdf_evidence
          path: wes-pdf-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Deliver exact verified original PDFs (one-day ZIP)
        if: steps.attempt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WES_2026_11_Two_Papers
          path: WES_2026_11_Two_Papers.zip
          if-no-files-found: error
          retention-days: 1
      - name: Fail closed if either original PDF unavailable
        if: steps.attempt.outcome != 'success'
        run: exit 1
