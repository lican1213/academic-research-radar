name: Academic Radar Six-PDF Acceptance (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf_probe.py'
      - 'tests/test_pdf_probe.py'
      - '.github/workflows/pdf-probe.yml'

permissions:
  contents: read

jobs:
  pdf-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -p 'test_pdf_probe.py' -v
      - name: Install PDF text parser (only for isolated acceptance)
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Real publisher PDF readback
        id: pdf
        continue-on-error: true
        run: python pdf_probe.py --out pdf-probe-result.json --zip-out JRYJ_2026_10_Six_Papers.zip
      - name: Retain metadata only (no PDFs or extracted text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-acceptance-${{ github.run_id }}
          path: pdf-probe-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Deliver verified original PDFs (ephemeral, one-day retention)
        if: steps.pdf.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JRYJ_2026_10_Six_Papers
          path: JRYJ_2026_10_Six_Papers.zip
          if-no-files-found: error
          retention-days: 1
      - name: Enforce real PDF gate
        if: steps.pdf.outcome != 'success'
        run: exit 1
