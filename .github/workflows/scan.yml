name: Academic Research Radar Scan

on:
  schedule:
    - cron: '17 10,22 * * *' # 18:17 and next-day 06:17 Asia/Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar.py'
      - 'chinese_journals.py'
      - '.github/workflows/scan.yml'

permissions:
  contents: write

concurrency:
  group: academic-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public metadata
        id: collect
        continue-on-error: true
        run: python radar.py --out data
      - name: Preserve latest status and seen ledger
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/latest.md data/seen.json data/chinese_seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh academic radar metadata [skip ci]'
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              # A concurrent code/MOC push must not silently lose new scan data.
              git pull --rebase origin main
              if [ "$attempt" -eq 3 ]; then
                echo "Scan data could not be published after three attempts" >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Upload independent audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-radar-${{ github.run_id }}
          path: |
            data/latest.json
            data/latest.md
            data/chinese_seen.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail if all sources failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
