name: Academic Research Radar Scan

on:
  schedule:
    - cron: '17 10,22 * * *' # 18:17 and next-day 06:17 Asia/Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar.py'
      - '.github/workflows/scan.yml'

permissions:
  contents: write

concurrency:
  group: academic-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public metadata
        id: collect
        continue-on-error: true
        run: python radar.py --out data
      - name: Preserve latest status and seen ledger
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/latest.md data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh academic radar metadata [skip ci]'
            git push
          fi
      - name: Upload independent audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-radar-${{ github.run_id }}
          path: |
            data/latest.json
            data/latest.md
          if-no-files-found: error
          retention-days: 30
      - name: Fail if all sources failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
