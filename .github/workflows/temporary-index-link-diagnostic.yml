name: Temporary Index HTML Link Diagnostic

on:
  push:
    paths:
      - '.github/workflows/temporary-index-link-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect only public canonical source pages
        run: |
          python - <<'PY'
          import html, json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__();self.items=[];self.anchor=None;self.words=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="a":
                      self.anchor=d.get("href");self.words=[]
                      if any(v for k,v in d.items() if k.lower() in ("onclick","data-id","data-url")):
                          self.items.append(("attributes",str(d)[:150]))
              def handle_data(self,d):
                  if self.anchor is not None:self.words.append(d)
              def handle_endtag(self,tag):
                  if tag=="a" and self.anchor is not None:
                      self.items.append((" ".join(self.words)[:80],self.anchor[:180]))
                      self.anchor=None;self.words=[]
          targets={
            "economic_catalog":"https://ncpssd.org/journal/details.aspx?gch=95645X",
            "industrial_catalog":"https://ncpssd.org/journal/details.aspx?gch=93800A",
            "management_mobile":"https://m.ncpssd.cn/journal/details?gch=95499X&langType=1&nav=1",
            "management_official_cbpt":"https://glsj.cbpt.cnki.net/portal/journal/portal/client/paper_list/type_benqi",
            "industry_official":"https://ciejournal.ajcass.com/",
            "management_official":"https://www.mwm.net.cn/",
          }
          needles={"economic_catalog":"机器人应用与制造业","industrial_catalog":"世界大变局下的中国产业链韧性","management_mobile":"管理世界"}
          for name,url in targets.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (public academic metadata audit)"})
                  with urllib.request.urlopen(req,timeout=8) as response:
                      body=response.read(700000)
                      ctype=response.headers.get("Content-Type","")
                      dest=response.geturl()
                  source=body.decode("utf-8","replace")
                  p=Links();p.feed(source)
                  target=needles.get(name,"")
                  at=source.find(target) if target else -1
                  anchor_snip=re.sub(r"\\s+"," ",source[max(0,at-250):at+400])[:650] if at>=0 else ""
                  links=[{"name":a,"href":b} for a,b in p.items if re.search(r"(?:article|detail|paper|secure|literature|机器人|供应链|世界大变局|href)",str(a)+" "+str(b),re.I)]
                  print("INDEX",json.dumps({"id":name,"status":200,"final":dest,"content_type":ctype,
                      "bytes":len(body),"total_anchors":len(p.items),
                      "relevant_anchors":links[:12],"needle_found":at>=0,
                      "title_html_context":anchor_snip},ensure_ascii=False))
              except Exception as e:
                  print("INDEX",json.dumps({"id":name,"error":type(e).__name__,"message":str(e)[:170]},ensure_ascii=False))
          PY
