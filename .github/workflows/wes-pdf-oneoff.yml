name: WES one-shot PDF UI and original evidence (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wes-pdf-oneoff.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cbpt-pdf-ui-evidence-20261120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline adversarial tests
        run: python -m unittest discover -s tests -p test_pdf_cbpt.py -v
      - name: Isolated tools
        run: |
          python -m pip install 'PyMuPDF>=1.24,<2' 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Probe real visible PDF controls and network shape
        id: ui
        continue-on-error: true
        run: python pdf_cbpt_ui_probe.py
      - name: Fetch and validate two original PDFs
        id: pdf
        continue-on-error: true
        run: python pdf_cbpt.py --out wes-pdf-evidence.json --zip-out WES_2026_11_Two_Papers.zip
      - name: Retain sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WES_2026_11_diagnostics
          path: |
            wes-cbpt-ui-diagnostics.json
            wes-pdf-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Deliver originals only on 2 of 2 full PDF validation
        if: steps.pdf.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WES_2026_11_Two_Papers
          path: WES_2026_11_Two_Papers.zip
          if-no-files-found: error
          retention-days: 1
      - name: Enforce 2 of 2
        if: steps.pdf.outcome != 'success'
        run: exit 1
